# ---------------------------------------------------------------------------
# FIT-Connect Camunda 7 poller - configuration template.
#
# These are DEFAULTS baked into the WAR. For a real deployment, override them
# with an external file:
#     -Dfitconnect.camunda.config=/etc/fitconnect/camunda.properties
# or with JVM system properties / environment variables (both win over this
# file). Keep client-secret and keys OUT of the WAR.
# ---------------------------------------------------------------------------

# FIT-Connect environment: TEST | STAGE | PROD
fitconnect.environment=TEST

# UUID of the destination (Zustellpunkt) to poll.
fitconnect.destination-id=00000000-0000-0000-0000-000000000000

# Subscriber credentials from the FIT-Connect Self-Service-Portal.
fitconnect.subscriber.client-id=CHANGE_ME
fitconnect.subscriber.client-secret=CHANGE_ME

# Private keys as JWK JSON documents. Accepts classpath:, file: or a bare path.
fitconnect.subscriber.signing-key-path=file:/etc/fitconnect/signing_key.json
fitconnect.subscriber.decryption-key-paths=file:/etc/fitconnect/decryption_key.json

# Page size for one poll of the delivery service.
fitconnect.poll.limit=50

# Self-triggering timer start event interval (ISO-8601 repeating interval or
# cron). R/PT5M = every 5 minutes.
fitconnect.poll.cycle=R/PT5M
