# Sample application.yaml for fitko-spring.
#
# Every key lives under the `fitconnect` prefix and binds to
# `com.gfi.ozg.fitko.spring.FitConnectProperties` - that class's javadoc is
# the source of truth if this file and the code ever disagree. Everything
# here also works as environment variables (FITCONNECT_SENDER_CLIENT_ID, ...)
# or any other Spring property source; YAML is just the easiest to read.
#
# Nothing below is required as shown - trim this down to whichever of
# sending/receiving your application actually does. See configuration.md
# in this same directory for the full property reference, defaults, and
# which combinations are required.

fitconnect:
  # Master switch. false disables sending, receiving, and the SDK client
  # beans entirely, regardless of the sender/receiver blocks below.
  enabled: true

  # TEST, STAGE, or PROD - selects the SDK's built-in endpoint defaults.
  # See https://docs.fitko.de/fit-connect/docs/getting-started/environments
  environment: TEST

  # --- Sending ("Onlinedienst") -------------------------------------------
  sender:
    enabled: true # set false if this application never sends
    client-id: ${FITCONNECT_SENDER_CLIENT_ID}
    client-secret: ${FITCONNECT_SENDER_CLIENT_SECRET}

  # --- Receiving ("Verwaltungssystem") ------------------------------------
  receiver:
    enabled: true # set false if this application never receives

    # Default subscriber credentials, used by any destination below that
    # doesn't set its own client-id/client-secret. Most setups only need
    # this - one Self-Service-Portal registration, polling several
    # destinations that all belong to it.
    client-id: ${FITCONNECT_RECEIVER_CLIENT_ID}
    client-secret: ${FITCONNECT_RECEIVER_CLIENT_SECRET}

    # Every Zustellpunkt this application polls. One background poller
    # handles the whole list. A FIT-Connect destination is registered with
    # its own signing/encryption key pair regardless of which subscriber
    # client polls it, so each entry carries its own keys - required, even
    # if two destinations happen to reuse the same key material. At least
    # one entry is required whenever receiver.enabled is true.
    destinations:
      - id: 9f6bb611-df46-494a-9a98-a253f1362dc7
        signing-key: file:/etc/fitconnect/destination-a/signing_key.json
        decryption-keys:
          - file:/etc/fitconnect/destination-a/decryption_key.json
          # add a second entry here while rotating keys; the incoming JWE's
          # `kid` picks the right one automatically, no code change needed
        # Only needed if callback.enabled below is true, and only for a
        # destination that should actually receive callbacks - the secret
        # given to FIT-Connect when registering this destination's Callback.
        callback-secret: ${FITCONNECT_DESTINATION_A_CALLBACK_SECRET}

      - id: 2b7e8f2a-6e0a-4c1a-8f0a-7e6c9a2b1234
        signing-key: file:/etc/fitconnect/destination-b/signing_key.json
        decryption-keys:
          - file:/etc/fitconnect/destination-b/decryption_key.json
        # Only needed if this destination was registered under a different
        # Self-Service-Portal client than the shared receiver.client-id/
        # client-secret above (e.g. a separate legal entity's registration).
        client-id: ${FITCONNECT_DESTINATION_B_CLIENT_ID}
        client-secret: ${FITCONNECT_DESTINATION_B_CLIENT_SECRET}
        # This destination has no callback-secret, so it's only ever reached
        # through polling, even with callback.enabled: true below.

    # What happens to a downloaded submission no @EventListener/
    # @SubmissionEventListener explicitly accepted or rejected: LEAVE (default,
    # safest - retried next poll), ACCEPT, or REJECT (as a generic
    # TechnicalError).
    default-outcome: LEAVE

    # Never enable in PROD - accepts a self-signed destination certificate.
    # Useful against a local/self-hosted TEST environment only.
    allow-insecure-public-key: false

    # Skip the SDK's local JSON-Schema validation of received submission
    # data. Leave false unless you have a specific reason to bypass it.
    skip-submission-data-validation: false

    # By default a submission that fails validation is auto-rejected with a
    # DataSchemaViolation. Set true to leave it on the delivery service
    # instead (e.g. to inspect it manually before deciding).
    disable-auto-reject: false

    polling:
      enabled: true       # set false to only fetch submissions on demand
      initial-delay: 5s   # delay after application startup before the first poll
      interval: 30s       # delay between the end of one poll and the start of the next
      limit: 100           # paging limit per destination per poll cycle
      submission-timeout: 10s  # max time for one submission before it's abandoned this cycle (always on)
      # Opt-in: a failed submission is otherwise retried every single cycle,
      # forever. Uncomment to instead back off for a while after a failure.
      # retry-cooldown: 20m
      # Name of the Spring Cache the retry-cooldown state is kept in. Back it
      # with Redis (TTL >= retry-cooldown) to share cooldowns across replicas;
      # otherwise a self-pruning in-process cache is used.
      # retry-cooldown-cache-name: fitconnect-retry-cooldown
      # Opt-in: with ShedLock (net.javacrumbs.shedlock:shedlock-core) on the
      # classpath and a LockProvider bean, only one replica runs any given
      # poll cycle instead of every replica re-downloading every submission.
      # distributed-lock:
      #   enabled: true
      #   lock-at-most-for: 5m   # default: 10 x interval
      #   lock-at-least-for: 30s  # default: interval

    # Opt-in: also keep the receive counts in Redis, shared by every replica,
    # and expose them as fitconnect.receive.fleet.* gauges (any one replica's
    # scrape then shows the whole fleet's totals - aggregate with max, not
    # sum). Needs spring-boot-starter-data-redis + spring.data.redis.*.
    # shared-metrics:
    #   enabled: true
    #   key-prefix: "fitconnect:receive:"

    # Optional webhook endpoint FIT-Connect can push new-submission
    # notifications to, instead of waiting for the next poll. Off by
    # default - needs spring-boot-starter-web on the classpath (an optional
    # dependency of this starter), and each destination that should use it
    # also needs its own callback-secret above (polling keeps working
    # regardless for any destination that doesn't). The full URL
    # (https://your-app-host<path>/<destinationId>) still has to be
    # registered as that destination's Callback with FIT-Connect separately,
    # via DestinationClient - outside this starter's scope.
    callback:
      enabled: false
      path: /fitconnect/callback

  # --- HTTP client timeouts (optional) ------------------------------------
  # Unset values keep the SDK's own default (30s each).
  http:
    connect-timeout: 10s
    read-timeout: 30s
    write-timeout: 30s

  # --- Endpoint overrides (optional, advanced) ----------------------------
  # Only needed to point the SDK at a local stub/self-hosted environment
  # instead of the real TEST/STAGE/PROD endpoints; each override only takes
  # effect for the `environment` selected above. Leave this whole block out
  # for a normal setup against FIT-Connect's real environments.
  # base-urls:
  #   auth: http://localhost:8080/auth
  #   routing: http://localhost:8080/routing
  #   self-service-portal: http://localhost:8080/ssp
  #   destination: http://localhost:8080/destination
  #   submission:
  #     - http://localhost:8080/submission
