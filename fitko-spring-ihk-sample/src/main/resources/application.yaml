# =====================================================================
# fitko-spring-ihk-sample configuration
#
# Coverage test: two of the (eventual) 79 regional tenants receiving
# Antraege, and a config-driven decision for which Camunda process to start
# per Leistung. See ../../README.md for what this project is testing.
#
# `fitconnect.*` binds to com.gfi.ozg.fitko.spring.FitConnectProperties -
# see fitko-spring's docs/configuration.md for the full reference.
# `antrag-routing.*` binds to com.example.ihk.routing.AntragRoutingProperties
# (this project's own routing decision, not part of fitko-spring).
#
# Values with no `:default` are required - the app fails fast at startup
# naming the missing one. Get a TEST client from the Self-Service-Portal:
#   https://docs.fitko.de/fit-connect/docs/getting-started/account
# =====================================================================

spring:
  application:
    name: fitko-spring-ihk-sample

fitconnect:
  enabled: true
  environment: ${FITCONNECT_ENVIRONMENT:TEST}

  # This sample only receives; a real sending use case would add a `sender`
  # block the same way fitko-spring-sample does.
  sender:
    enabled: false

  receiver:
    enabled: true
    client-id: ${FITCONNECT_RECEIVER_CLIENT_ID}
    client-secret: ${FITCONNECT_RECEIVER_CLIENT_SECRET}

    # Two of the 79 IHK regions as tenants, for this coverage test - see
    # fitko-spring's docs/configuration.md, "Splitting configuration across
    # files", for growing this to all 79 without one unmanageable block (one
    # imported file per region, keyed the same way).
    tenants:
      101-aachen:
        destinations:
          antragseingang:
            id: ${FITCONNECT_AACHEN_DESTINATION_ID}
            signing-key: ${FITCONNECT_AACHEN_SIGNING_KEY:file:./keys/101-aachen/signing_key.json}
            decryption-keys:
              - ${FITCONNECT_AACHEN_DECRYPTION_KEY:file:./keys/101-aachen/decryption_key.json}
      133-hannover:
        destinations:
          antragseingang:
            id: ${FITCONNECT_HANNOVER_DESTINATION_ID}
            signing-key: ${FITCONNECT_HANNOVER_SIGNING_KEY:file:./keys/133-hannover/signing_key.json}
            decryption-keys:
              - ${FITCONNECT_HANNOVER_DECRYPTION_KEY:file:./keys/133-hannover/decryption_key.json}

    default-outcome: LEAVE

    polling:
      enabled: true
      initial-delay: 5s
      interval: ${FITCONNECT_POLL_INTERVAL:30s}
      # A submission whose ProcessStarter failed transiently (threw anything
      # but ProcessStartRejectedException) stays on the delivery service and
      # is retried - without this, on every single poll cycle, forever.
      retry-cooldown: ${FITCONNECT_RETRY_COOLDOWN:20m}

# The routing decision under test: which ProcessStarter IMPLEMENTATION
# CLASS handles a given (tenant, Leistung) pair, keyed by tenant then by the
# Leistung's LeiKa-Schluessel URN - config-driven so ops/business can add a
# Leistung, or override it for one region, without further code changes to
# the routing itself (the implementation classes still have to exist and be
# Spring beans - see com.example.ihk.processstarter.ProcessStarterLookup).
# See also com.example.ihk.routing.AntragRoutingProperties / AntragProcessResolver.
#
# Each value is a fully-qualified class implementing ProcessStarter, not an
# arbitrary process-key string - different Leistungen (or the same Leistung
# for different tenants) can be handled by entirely different implementations,
# not just a different process definition run by one shared implementation.
# The same Leistung (99050035001000) intentionally maps to a different
# implementation class per tenant here, to prove that's possible: each IHK
# region may run its own Fachverfahren - possibly through different code
# entirely - for a nationally standardized Leistung. Both classes below are
# stubs shipped with this sample (see their own javadoc); replace with your
# real implementations. The LeiKa URNs are illustrative placeholders, not
# real codes - replace with your actual Leistungen.
antrag-routing:
  process-starter-by-tenant:
    101-aachen:
      "urn:de:fim:leika:leistung:99050035001000": com.example.ihk.processstarter.impl.LoggingProcessStarter
      "urn:de:fim:leika:leistung:99050035002000": com.example.ihk.processstarter.impl.NoopProcessStarter
    133-hannover:
      "urn:de:fim:leika:leistung:99050035001000": com.example.ihk.processstarter.impl.NoopProcessStarter
      "urn:de:fim:leika:leistung:99050035002000": com.example.ihk.processstarter.impl.NoopProcessStarter
  # Unmapped (tenant, Leistung) pairs are logged and left unresolved (not
  # guessed) when this is unset - see AntragRoutingListener.
  default-process-starter-class: com.example.ihk.processstarter.impl.NoopProcessStarter

logging:
  level:
    com.example.ihk: DEBUG
    com.gfi.ozg.fitko.spring: DEBUG
